[package]
name = "h3wire-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
h3wire = { path = "../h3wire" }

# Not a member of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qpack_decoder"
path = "fuzz_targets/qpack_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_ops"
path = "fuzz_targets/api_ops.rs"
test = false
doc = false
bench = false
